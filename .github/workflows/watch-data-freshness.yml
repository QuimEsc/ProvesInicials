name: Watch dashboard data freshness

# Supervises the effective source check / pipeline heartbeat in docs/data/manifest.json
# within market operating hours (never the age of unchanged quotations).
# - Preventive self-heal triggers silently at >45 min (`needs_self_heal = true`).
# - Primary threshold is 60 min (`stale = true`, exit code 2).
# - Only opens/updates an alert issue and fails when stale delay persists >= 120 min
#   in market hours or when self-heal dispatch fails, avoiding false/duplicate alerts.

on:
  workflow_dispatch:
  schedule:
    - cron: "22,52 6-22 * * 1-5"

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: watch-dashboard-freshness
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Evaluate freshness
        id: eval
        run: |
          set +e
          python monitor_freshness.py --manifest docs/data/manifest.json --json-out freshness.json
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          eval "$(python - << 'PY'
          import json
          r = json.load(open("freshness.json", encoding="utf-8"))
          age = r.get("effective_age_min")
          age_int = int(float(age)) if age is not None else 99999
          heal = "true" if r.get("needs_self_heal") else "false"
          active = "true" if r.get("market_active") else "false"
          print(f"AGE={age_int}")
          print(f"HEAL={heal}")
          print(f"MARKET={active}")
          PY
          )"
          echo "age_min=$AGE" >> "$GITHUB_OUTPUT"
          echo "needs_self_heal=$HEAL" >> "$GITHUB_OUTPUT"
          echo "market_active=$MARKET" >> "$GITHUB_OUTPUT"

      - name: Self-heal when delayed in market hours
        id: heal
        if: steps.eval.outputs.needs_self_heal == 'true' || steps.eval.outputs.code == '2'
        run: |
          ACTIVE=$(gh run list --workflow update-pages-data.yml --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress")] | length')
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          if [ "$ACTIVE" = "0" ]; then
            if gh workflow run update-pages-data.yml --ref main; then
              echo "dispatched=1" >> "$GITHUB_OUTPUT"
              echo "Auto-reparació silenciosa activada: s'ha llançat update-pages-data.yml." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "dispatched=0" >> "$GITHUB_OUTPUT"
              echo "ERROR: no s'ha pogut llançar update-pages-data.yml." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "dispatched=0" >> "$GITHUB_OUTPUT"
            echo "Ja hi ha una actualització en cua o en curs ($ACTIVE); no es duplica el dispatch." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open, update, or close the alert issue (best effort)
        continue-on-error: true
        run: |
          TITLE="Actualització de dades endarrerida (>60 min en horari de mercat)"
          OPEN=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          AGE="${{ steps.eval.outputs.age_min }}"
          CODE="${{ steps.eval.outputs.code }}"
          MARKET="${{ steps.eval.outputs.market_active }}"
          if [ "$CODE" = "2" ] && [ "$MARKET" = "true" ] && [ "$AGE" -ge 120 ]; then
            {
              echo "Informe del watchdog (retard persistent >= 120 min en horari de mercat):"
              echo ""
              echo '```json'
              cat freshness.json
              echo '```'
            } > issue_body.md
            if [ -z "$OPEN" ]; then
              gh issue create --title "$TITLE" --body-file issue_body.md
            else
              # Edit in place instead of commenting every cycle to avoid duplicate email alerts.
              gh issue edit "$OPEN" --body-file issue_body.md
            fi
          elif [ "$CODE" = "0" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "Dades de nou al dia."
          fi

      - name: Fail when persistent (>=120 min) or unrecoverable delay in market hours
        if: steps.eval.outputs.code == '2' && steps.eval.outputs.market_active == 'true' && (fromJSON(steps.eval.outputs.age_min) >= 120 || (steps.heal.outputs.dispatched != '1' && steps.heal.outputs.active == '0'))
        run: |
          echo "Market-hours data delay persisted for ${{ steps.eval.outputs.age_min }} minutes and could not recover automatically." >&2
          exit 1
